[project]
name = "mandarin-tones-phonological-neighbors"
version = "0.1.0"
description = "Research on Mandarin tones and phonological neighbors"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cwngraph==0.4.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
twlex = "tw_lexicon.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tw_lexicon"]

[dependency-groups]
dev = ["pytest>=8"]
